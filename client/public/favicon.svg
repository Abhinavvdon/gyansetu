<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6443c9"/>
      <stop offset="100%" stop-color="#3c1e7a"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a48de5"/>
      <stop offset="100%" stop-color="#55309d"/>
    </linearGradient>
  </defs>

  <!-- Left Outer Page Wing -->
  <path d="M 30,70 L 30,135 Q 30,140 38,142 L 85,153 Q 95,155 95,148 L 95,65 Q 95,58 87,55 L 42,42 Q 30,38 30,48 Z" fill="url(#bookGrad)"/>

  <!-- Left Inner Page Layer -->
