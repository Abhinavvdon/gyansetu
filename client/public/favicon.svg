  <path d="M 50,78 L 50,124 L 85,133 L 85,72 Z" fill="url(#pageGrad)"/>

  <!-- Right Outer Page Wing -->
  <path d="M 170,70 L 170,135 Q 170,140 162,142 L 115,153 Q 105,155 105,148 L 105,65 Q 105,58 113,55 L 158,42 Q 170,38 170,48 Z" fill="url(#bookGrad)"/>

  <!-- Right Inner Page Layer -->
  <path d="M 154,75 L 154,128 L 112,138 L 112,68 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 150,78 L 150,124 L 115,133 L 115,72 Z" fill="url(#pageGrad)"/>

  <!-- Center Spine & Nib / Pin -->
  <path d="M 100,50 L 100,158" stroke="#3c1e7a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="98" r="8" fill="#ffffff" stroke="#3c1e7a" stroke-width="4"/>

  <!-- Bottom Binding Curve -->
