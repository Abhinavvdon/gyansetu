version: "1"

# ==============================================================================
# GyanSetu Render Blueprint (Infrastructure-as-Code)
# Deploys:
#   1. Managed PostgreSQL Database (Free Tier)
#   2. Fullstack Unified Web Service (Spring Boot + React 19 Frontend)
# ==============================================================================

databases:
  - name: gyansetu-db
    databaseName: gyansetu
    user: gyansetu
    plan: free

services:
  - type: web
    name: gyansetu-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Explicit connection properties (Directly wired to Spring Boot HikariDataSource)
      - key: DB_HOST
        fromDatabase:
          name: gyansetu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gyansetu-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: gyansetu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gyansetu-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: gyansetu-db
          property: database

      # Full connection string fallback
      - key: DATABASE_URL
        fromDatabase:
          name: gyansetu-db
          property: connectionString

      # Dynamic port binding
      - key: PORT
        value: 10000

      # Auto-migrate database tables on launch
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      # Optional Gemini API Key for AI features
      - key: GEMINI_API_KEY
        sync: false
