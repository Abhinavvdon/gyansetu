server.port=${PORT:8085}
spring.application.name=gyansetu-backend
management.endpoints.web.exposure.include=health,info

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:gyansetu}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Cloud Resiliency & Retries (Waits up to 60s for cloud DB to be ready)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging configuration
logging.level.org.gyansetu=INFO
logging.level.org.springframework.web=INFO

# Email Configuration (JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# GyanSetu Notification Settings
gyansetu.mail.from=${GYANSETU_MAIL_FROM:alerts@gyansetu.edu.in}
gyansetu.mail.sender-name=GyanSetu Deadline Alerts (ज्ञानसेतु)
