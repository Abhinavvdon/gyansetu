server.port=${PORT:8085}
spring.application.name=gyansetu-backend
management.endpoints.web.exposure.include=health,info

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/gyansetu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging configuration
logging.level.org.gyansetu=INFO
logging.level.org.springframework.web=INFO

# Email Configuration (JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# GyanSetu Notification Settings
gyansetu.mail.from=${GYANSETU_MAIL_FROM:alerts@gyansetu.edu.in}
gyansetu.mail.sender-name=GyanSetu Deadline Alerts (ज्ञानसेतु)
